name: Build mt76 for Teclast P30T
on: workflow_dispatch

env:
  KCOMMIT: 4ea0fcb5d1308f2f5a5dec0a3a5c8f1b261e00c7

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            lz4 cpio kmod git curl zip file

      - name: Fetch kernel source (exact commit)
        run: |
          mkdir -p ks
          curl -sSL "https://android.googlesource.com/kernel/common/+archive/${KCOMMIT}.tar.gz" \
            | tar -xz -C ks
          ls ks/Makefile && head -5 ks/Makefile

      - name: Fetch Android Clang r450784e
        run: |
          mkdir -p clang
          for BR in android13-release android14-release main master; do
            echo "Trying branch: $BR"
            URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$BR/clang-r450784e.tar.gz"
            if curl -sSL "$URL" -o c.tar.gz && file c.tar.gz | grep -q gzip; then
              echo "OK from $BR"
              tar -xzf c.tar.gz -C clang
              break
            fi
            rm -f c.tar.gz
          done
          clang/bin/clang --version

      - name: Configure
        working-directory: ks
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make LLVM=1 ARCH=arm64 O=out gki_defconfig
          ./scripts/config --file out/.config \
            -e WLAN \
            -m CFG80211 \
            -m MAC80211 \
            -e WLAN_VENDOR_MEDIATEK \
            -m MT76x2U
          make LLVM=1 ARCH=arm64 O=out olddefconfig
          echo "--- result ---"
          grep -E "CONFIG_(WLAN=|CFG80211=|MAC80211=|MT76)" out/.config || echo "NOTHING FOUND"

      - name: Add swap
        run: |
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Build
        working-directory: ks
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make LLVM=1 ARCH=arm64 O=out -j$(nproc)

      - name: Collect modules
        run: |
          mkdir -p ko
          find ks/out -name "mac80211.ko" -o -name "mt76*.ko" | xargs -I{} cp {} ko/
          ls -la ko/

      - uses: actions/upload-artifact@v4
        with:
          name: mt76-modules
          path: ko/
