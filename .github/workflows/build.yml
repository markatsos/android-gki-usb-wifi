name: Build mt76 for UMS9230
on: workflow_dispatch

# Fixed, non-parametrized build hard-wired to the Teclast P30T / UMS9230
# reference values. For other devices use build-auto.yml instead.
env:
  KCOMMIT: 4ea0fcb5d1308f2f5a5dec0a3a5c8f1b261e00c7

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            lz4 cpio kmod git curl zip file dwarves
          pahole --version

      - name: Fetch kernel source (exact commit)
        run: |
          mkdir -p ks
          curl -fsSL --retry 3 "https://android.googlesource.com/kernel/common/+archive/${KCOMMIT}.tar.gz" \
            | tar -xz -C ks
          ls ks/Makefile && head -3 ks/Makefile

      - name: Fetch Android Clang r450784e
        run: |
          mkdir -p clang
          CV="clang-r450784e"
          got=0
          fetch() {
            for try in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 2 "$1" -o c.tar.gz \
                 && file c.tar.gz | grep -q gzip; then return 0; fi
              echo "   retry $try failed"; sleep 3
            done
            return 1
          }
          for BR in android13-release android14-release main master; do
            URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/$BR/$CV.tar.gz"
            echo "Trying $BR ..."
            if fetch "$URL"; then
              tar -xzf c.tar.gz -C clang && got=1 && echo "OK from $BR" && break
            fi
            rm -f c.tar.gz
          done
          if [ "$got" != "1" ]; then
            echo "::error::Could not fetch $CV (after retries). Re-run; googlesource occasionally drops HTTP/2 streams."
            exit 1
          fi
          clang/bin/clang --version

      - name: Configure
        working-directory: ks
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          cat >> arch/arm64/configs/gki_defconfig <<'CFG'
          CONFIG_WLAN=y
          CONFIG_CFG80211=m
          CONFIG_MAC80211=m
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT76_CORE=m
          CONFIG_MT76_USB=m
          CONFIG_MT76x02_LIB=m
          CONFIG_MT76x02_USB=m
          CONFIG_MT76x2_COMMON=m
          CONFIG_MT76x2U=m
          CFG
          make LLVM=1 ARCH=arm64 O=out gki_defconfig
          make LLVM=1 ARCH=arm64 O=out olddefconfig
          echo "--- result ---"
          grep -E "CONFIG_(CFG80211=|MAC80211=|MT76|DEBUG_INFO_BTF|LTO_CLANG)" out/.config

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Build
        working-directory: ks
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make LLVM=1 ARCH=arm64 O=out -j$(nproc)

      - name: Show module_layout CRC
        if: always()
        working-directory: ks
        run: |
          echo "=== module_layout CRC (compare to your device!) ==="
          grep -w module_layout out/Module.symvers || echo "not found"

      - name: Collect modules
        if: always()
        run: |
          mkdir -p ko
          find ks/out \( -name "mac80211.ko" -o -name "mt76*.ko" -o -name "cfg80211.ko" \) \
            -exec cp {} ko/ \; || true
          cp ks/out/Module.symvers ko/ 2>/dev/null || true
          ls -la ko/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mt76-modules
          path: ko/
